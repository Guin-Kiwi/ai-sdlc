name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AI-SDLC lifecycle artefacts
        run: bash scripts/check-lifecycle.sh

      - name: Check whitespace errors
        run: git diff --check

      - name: Run project tests
        shell: bash
        run: |
          if [ -f scripts/test.sh ]; then
            bash scripts/test.sh
          else
            echo "::notice::No scripts/test.sh yet. Add it during VALIDATE with the project's test commands."
          fi
