name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required AI-SDLC artefacts
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PROJECT.md
          test -f docs/TASKS.md
          test -f docs/specs/UC-TEMPLATE.md
          test -f docs/adr/ADR-TEMPLATE.md
          test -f docs/INDEX.json
          test -f docs/STANDARDS.md
          test -f docs/AGENT-GUIDANCE.md
          test -f .github/copilot-instructions.md
          test -d skills

      - name: Verify skill and index files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/INDEX.json > /dev/null
          for dir in skills/*/; do
            test -f "${dir}SKILL.md"
            python3 -m json.tool "${dir}index.json" > /dev/null
          done

      - name: Check whitespace errors
        run: git diff --check

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
